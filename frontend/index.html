<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: تمتدّ الواجهة تحت الشقّ العلوي وشريط الأسفل في آيفون،
         ونعوّضها بـ safe-area في index.css حتى لا يُقصّ أي زر. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="احجز موعدك الطبي في الجزائر خلال ثوانٍ — بدون تسجيل، اختر التخصص والولاية والطبيب والوقت المناسب." />
    <meta property="og:title" content="مادبوك — MadBook" />
    <meta property="og:description" content="منصة حجز وإدارة المواعيد الطبية." />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- تثبيت الموقع كتطبيق (PWA) على أندرويد وآيفون والكمبيوتر. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#187f77" />
    <!-- آيفون لا يقبل SVG كأيقونة تطبيق؛ لذلك أيقونة PNG مربّعة غير شفافة. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="مادبوك" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>مادبوك — MadBook | حجز المواعيد الطبية</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/register-sw.js" defer></script>
  </body>
</html>
