# خادم Render المجاني ينام بعد نحو 15 دقيقة بلا طلبات، فيستغرق أول فتح للموقع بعد ذلك
# قرابة الدقيقة (وهو ما كان يجعل لوحة الطبيب تبدو معلّقة عند فتحها من الهاتف). هذه المهمة
# تطرق نقطة /health كل 10 دقائق فيبقى الخادم مستيقظًا — مجانًا، فالمستودع عام وتشغيل
# GitHub Actions فيه بلا حدود.
#
# ملاحظة مهمة: GitHub يؤخّر الجداول القصيرة بشدة — قسنا فواصل التشغيل الفعلية
# فوجدناها من ساعتين إلى خمس ساعات رغم طلب كل 10 دقائق. لذلك أصبح إبقاء الخادم
# مستيقظًا مسؤولية الخادم نفسه (طرق ذاتي كل 10 دقائق في backend/src/index.ts)، ودور هذه
# المهمة أصبح احتياطيًا: إيقاظه إن نام فعلًا، لأن النائم لا يستطيع طرق نفسه.
name: Keep backend awake

on:
  schedule:
    # التوقيت هنا بـUTC، والجزائر UTC+1. نوافق نافذة الخادم حتى لا توقظه هذه المهمة ليلًا
    # فتستهلك ساعات التشغيل المجانية دون فائدة.
    # السبت–الخميس: من 05:00 إلى 18:00 بتوقيت الجزائر
    - cron: "*/5 4-16 * * 0,1,2,3,4,6"
    # الجمعة: من 17:00 إلى 18:00 بتوقيت الجزائر
    - cron: "*/5 16 * * 5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          for attempt in 1 2 3; do
            # Check execution time, not scheduled time: delayed/manual runs must not wake it at night.
            utc_hour=$((10#$(date -u +%H)))
            utc_day=$(date -u +%u)
            start_hour=4
            if [ "$utc_day" = "5" ]; then start_hour=16; fi
            if [ "$utc_hour" -lt "$start_hour" ] || [ "$utc_hour" -ge 17 ]; then
              echo "Outside keep-awake hours (Algeria); skipping ping."
              exit 0
            fi
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 https://medbook-xg66.onrender.com/health || echo "000")
            echo "Attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "الخادم لم يستجب بعد ثلاث محاولات"
          exit 1
