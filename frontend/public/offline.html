<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مادبوك — لا يوجد اتصال</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        font-family: Cairo, Tahoma, system-ui, sans-serif;
        color: #16514e;
        background: #f8fafc;
      }
      h1 { font-size: 20px; margin: 0; }
      p { margin: 0; font-size: 14px; color: #64748b; max-width: 320px; line-height: 1.7; }
      button {
        margin-top: 8px;
        border: 0;
        border-radius: 12px;
        background: #187f77;
        color: #fff;
        font: inherit;
        font-weight: 700;
        padding: 10px 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/logo.svg" width="56" height="56" alt="مادبوك" />
    <h1 id="offline-title">لا يوجد اتصال بالإنترنت</h1>
    <p id="offline-text">بعض وظائف مادبوك تحتاج إلى اتصال. تحقق من اتصالك ثم أعد المحاولة — مواعيدك المحجوزة محفوظة ولن تضيع.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
    <script>
      // الصفحة تُعرض حين يفشل طلب فتح الموقع نفسه على مستوى الشبكة. هذا لا يعني دائمًا أن الجهاز بلا إنترنت:
      // إن كان navigator.onLine صحيحًا فالمشكلة في الوصول إلى مادبوك (تقلّب شبكة/DNS/خادم) فنقول ذلك بدقة.
      (function () {
        var title = document.getElementById("offline-title");
        var text = document.getElementById("offline-text");
        var offlineTitle = title.textContent;
        var offlineText = text.textContent;
        function render() {
          if (navigator.onLine === false) {
            title.textContent = offlineTitle;
            text.textContent = offlineText;
          } else {
            title.textContent = "تعذّر الوصول إلى مادبوك";
            text.textContent = "جهازك متصل بالإنترنت، لكن تعذّر الوصول إلى مادبوك الآن. حاول مرة أخرى بعد قليل.";
          }
        }
        render();
        window.addEventListener("offline", render);
        window.addEventListener("online", function () { location.reload(); });
      })();
    </script>
  </body>
</html>
