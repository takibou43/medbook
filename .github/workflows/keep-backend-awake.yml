# خادم Render المجاني ينام بعد نحو 15 دقيقة بلا طلبات.
# هذه المهمة تطرق /health كل 10 دقائق خلال نافذة الاستيقاظ فقط.
# الجدولة احتياطية وقد تتأخر؛ لا تضمن بقاء الخدمة مستيقظة.
#
# ملاحظة مهمة: GitHub يؤخّر الجداول القصيرة بشدة — قسنا فواصل التشغيل الفعلية
# فوجدناها من ساعتين إلى خمس ساعات رغم طلب كل 10 دقائق. لذلك أصبح إبقاء الخادم
# مستيقظًا مسؤولية الخادم نفسه (طرق ذاتي كل 10 دقائق في backend/src/index.ts)، ودور هذه
# المهمة أصبح احتياطيًا: إيقاظه إن نام فعلًا، لأن النائم لا يستطيع طرق نفسه.
name: Keep backend awake

permissions:
  contents: read

concurrency:
  group: keep-backend-awake
  cancel-in-progress: false

on:
  schedule:
    # التوقيت هنا بـUTC، والجزائر UTC+1. نوافق نافذة الخادم حتى لا توقظه هذه المهمة ليلًا
    # فتستهلك ساعات التشغيل المجانية دون فائدة.
    # يوميًا: من 08:00 إلى 16:00 بتوقيت الجزائر (07:00–15:00 UTC)، لمدة ثماني ساعات.
    - cron: "*/10 7-14 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping health endpoint
        run: |
          for attempt in 1 2 3; do
            # Check execution time, not scheduled time: delayed/manual runs must not wake it at night.
            utc_clock=$(date -u +%H:%M)
            utc_hour=${utc_clock%:*}
            utc_minute=${utc_clock#*:}
            utc_minutes=$((10#$utc_hour * 60 + 10#$utc_minute))
            if [ "$utc_minutes" -lt 420 ] || [ "$utc_minutes" -ge 900 ]; then
              echo "Outside keep-awake hours (Algeria); skipping ping."
              exit 0
            fi
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 https://medbook-xg66.onrender.com/health || echo "000")
            echo "Attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "الخادم لم يستجب بعد ثلاث محاولات"
          exit 1
