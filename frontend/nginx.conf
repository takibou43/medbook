server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), payment=(), usb=(), geolocation=(self)" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    # A sensitive path must never receive the SPA fallback or a directory index.
    location ~ (^|/)\. { return 404; }
    location ~* \.(pem|key|bak|backup|dump|sql|map)$ { return 404; }

    # Keep PWA entry files fresh without overriding the security headers above.
    location ~ ^/(sw\.js|register-sw\.js|manifest\.webmanifest|index\.html)$ {
        expires -1;
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
